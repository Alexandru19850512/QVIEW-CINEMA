<!DOCTYPE html>
<html lang="ru">

<head>
    <script src="https://openfpcdn.io/fingerprintjs/v4"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QVIEW WatchParty — Настройка комнаты</title>
    <style>
        :root {
            --bg-dark: #12131C;
            --surface: #1E2030;
            --accent-cyan: #00E5FF;
            --accent-purple: #9D4EDD;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A5C0;
            --border: #2F334D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .pin-display {
            background: rgba(0, 229, 255, 0.1);
            border: 1px dashed var(--accent-cyan);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-bottom: 24px;
            display: none;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        input,
        select,
        textarea {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea {
            resize: vertical;
            height: 80px;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent-cyan);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-group input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--accent-cyan);
            cursor: pointer;
        }

        .checkbox-group label {
            margin-bottom: 0;
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-cyan), #00B0FF);
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: var(--border);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
            opacity: 1;
        }

        .error-message {
            background-color: rgba(255, 23, 68, 0.1);
            border: 1px solid #FF1744;
            color: #FF1744;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .success-message {
            text-align: center;
            display: none;
        }

        .success-icon {
            font-size: 48px;
            color: #00E676;
            margin-bottom: 16px;
        }

        .success-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <div class="card">
        <!-- Форма настройки -->
        <div id="setup-form">
            <div class="header">
                <div class="logo">QVIEW CINEMA</div>
                <div class="title">Настройка WatchParty</div>
                <div class="subtitle">Заполните карточку комнаты для вещания</div>
            </div>

            <div id="pin-banner" class="pin-display">PIN сессии: <span id="pin-text">------</span></div>
            <div id="error-box" class="error-message"></div>

            <div class="form-group">
                <label for="owner-name">Ваш никнейм (Организатор)</label>
                <input type="text" id="owner-name" placeholder="Например: Alex777, MovieMaster" required>
            </div>

            <div class="form-group">
                <label for="room-title">Название фильма / Стрима</label>
                <input type="text" id="room-title" placeholder="Например: Big Buck Bunny, Прямой эфир"
                    value="Новая комната просмотра">
            </div>

            <div class="form-group">
                <label for="room-description">Описание контента</label>
                <textarea id="room-description"
                    placeholder="Краткое описание того, что будете смотреть вместе с друзьями..."></textarea>
            </div>

            <div class="form-group">
                <label for="stream-url">Ссылка на видеопоток (.m3u8, .mp4)</label>
                <input type="url" id="stream-url" placeholder="https://domain.com/playlist.m3u8" required>
            </div>

            <div class="form-group">
                <label for="stream-type">Тип потока</label>
                <select id="stream-type">
                    <option value="HLS" selected>HLS Live (.m3u8)</option>
                    <option value="VOD">Фильм / Файл (VOD / MP4)</option>
                    <option value="AUDIO">Аудио / Радио поток</option>
                </select>
            </div>

            <div class="form-group">
                <label for="room-category">Категория</label>
                <input type="text" id="room-category" placeholder="Кино, Спорт, IPTV, Сериалы" value="Кино">
            </div>

            <div class="form-group">
                <label for="poster-url">Ссылка на обложку / постер</label>
                <input type="url" id="poster-url" placeholder="https://example.com/poster.jpg (необязательно)">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="is-permanent">
                <label for="is-permanent">Постоянная комната (не удалять после выхода)</label>
            </div>

            <button type="button" id="submit-btn" class="btn">🚀 Активировать и запустить на ТВ</button>
        </div>

        <!-- Экран успеха -->
        <div id="success-screen" class="success-message">
            <div class="success-icon">✓</div>
            <div class="success-text">Комната полностью готова!</div>
            <div class="subtitle">Данные записаны в Supabase. Телевизор поймал сигнал и открывает лобби трансляции.
                Вкладку можно закрыть.</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://dmflfzeaprsaxjvmnzdz.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZmxmemVhcHJzYXhqdm1uemR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MjM5MDUsImV4cCI6MjEwNTI5OTkwNX0.v6bZEvimGd4zIfFTITHOvniIYqzgTpZcNy5ioElJd8M";

        // UUID телефона на основе железа устройства (FingerprintJS)
        let deviceUUID = null;
        FingerprintJS.load().then(fp => fp.get()).then(result => {
            deviceUUID = result.visitorId;
        });

        const urlParams = new URLSearchParams(window.location.search);
        const pin = urlParams.get('pin');

        if (pin) {
            document.getElementById('pin-banner').style.display = 'block';
            document.getElementById('pin-text').innerText = pin;
        } else {
            showError("Ошибка: Не найден PIN сессии в адресе. Отсканируйте код с ТВ заново.");
            document.getElementById('submit-btn').disabled = true;
        }

        function showError(msg) {
            const errBox = document.getElementById('error-box');
            errBox.innerText = msg;
            errBox.style.display = 'block';
        }

        document.getElementById('submit-btn').addEventListener('click', async () => {
            const ownerName = document.getElementById('owner-name').value.trim();
            const title = document.getElementById('room-title').value.trim();
            const description = document.getElementById('room-description').value.trim();
            const streamUrl = document.getElementById('stream-url').value.trim();
            const streamType = document.getElementById('stream-type').value;
            const category = document.getElementById('room-category').value.trim();
            const posterUrl = document.getElementById('poster-url').value.trim();
            const isPermanent = document.getElementById('is-permanent').checked;

            document.getElementById('error-box').style.display = 'none';

            if (!pin) return;
            if (!ownerName) {
                showError("Пожалуйста, укажите ваш никнейм.");
                return;
            }
            if (!streamUrl) {
                showError("Пожалуйста, укажите ссылку на медиапоток.");
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Отправка в Supabase...";

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/rooms?pin=eq.${pin}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        owner_name: ownerName,
                        title: title || `Комната #${pin}`,
                        description: description,
                        stream_url: streamUrl,
                        stream_type: streamType,
                        category: category || "Кино",
                        poster_url: posterUrl,
                        backdrop_url: posterUrl,
                        is_permanent: isPermanent,
                        status: "active",
                        updated_at: new Date().toISOString()
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.message || "Ошибка базы данных.");
                }

                document.getElementById('setup-form').style.display = 'none';
                document.getElementById('success-screen').style.display = 'block';

            } catch (error) {
                console.error(error);
                showError(`Ошибка активации: ${error.message}`);
                btn.disabled = false;
                btn.innerText = "🚀 Активировать и запустить на ТВ";
            }
        });
    </script>
</body>

</html>
